# Builds the Svelte app in frontend/ and deploys it to Azure Static Web Apps.
#
# The deploy is gated on the TypeScript engine still matching the Python one:
# fixtures are regenerated from the Python engine on every run, so a change to
# ai.py that the port does not follow fails here instead of shipping.
#
# Setup: create a Static Web App (Free plan is enough) with deployment source
# "Other", copy its deployment token, and save it in this repository as the
# secret AZURE_STATIC_WEB_APPS_API_TOKEN.
name: Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.12 exactly: sum() over floats changed in 3.12 and the port follows it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export engine fixtures from Python
        run: python tests/fixtures/export_ts_fixtures.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Type-check
        working-directory: frontend
        run: npm run check
      - name: Test (engine parity + table flow)
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close staging environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
