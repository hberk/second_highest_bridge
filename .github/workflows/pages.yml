# Checks every change and deploys the game to Cloudflare, its one site:
# https://bridge.second-highest.workers.dev (solo play and tables with friends).
#
# The deploy is gated on the TypeScript engine still matching the Python one:
# fixtures are regenerated from the Python engine on every run, so a change to
# ai.py that the port does not follow fails here instead of shipping. It is
# also gated on the Python suite (tests/run_all.py, ~3 minutes), which runs as
# its own job beside the build. The Rust solver test skips cleanly: the
# solver-rs binary isn't built here. Its WebAssembly build is: the History
# replayer runs it, and dd.test.ts checks it against the Python solver.
#
# GitHub Pages and the homelab release were retired on 2026-11-22: nothing here
# deploys to either any more. The file keeps its old name so links to it hold.
#
# Nothing runs while the repository is private: Actions minutes on a private
# repo are metered, so every job is skipped (a skipped job starts no runner and
# uses no minutes). A manual "Run workflow" still checks it on demand. Once the
# repo is public, every push and pull request is checked (free on public repos)
# and a push to main deploys. Use "Run workflow", not "Re-run": a re-run
# replays the original event, visibility included, so a run from while the
# repo was private skips again.
name: Build, test and deploy (Cloudflare)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Superseded PR runs are cancelled; a deploy from main is never cut off mid-flight.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python-tests:
    if: github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The table count's play rules (v0.1.4-alpha) enumerate suit layouts on
    # every card, so the seeded games take longer: 28 minutes on the PR.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # 3.12 is the reference: 3.12's sum() can move a hand's value in the
      # last bit (see CLAUDE.md, "Environment").
      # The Python engine needs nothing outside the standard library.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test (rules, scoring, bidding, solver, challenge, LIN)
        run: python tests/run_all.py

  # The multiplayer table server (server/): its own tests over real sockets,
  # and its bundle. The Cloudflare Worker (server/cf) shares its table code,
  # so both are checked here.
  server:
    if: github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # node:sqlite without a flag needs Node 24.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm ci
      - name: Type-check
        working-directory: server
        run: npm run check
      - name: Test (sockets, limits, restart, static files)
        working-directory: server
        run: npm test
      - name: Bundle (fails if the challenge deal library rides along)
        working-directory: server
        run: npm run build
      # The same tables on Cloudflare (server/cf): a Worker and a Durable
      # Object per table, run in workerd, wrangler's local runtime.
      - name: Install (Cloudflare)
        working-directory: server/cf
        run: npm ci
      - name: Type-check (Cloudflare)
        working-directory: server/cf
        run: npm run check
      - name: Test (Cloudflare, in workerd)
        working-directory: server/cf
        run: npm test

  build:
    if: github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Fixtures plus the engine parity games, slower since the table count
    # (v0.1.4-alpha): over 30 minutes on the PR, 21 for npm test alone locally.
    # The v0.1.6-alpha deploy from main hit 60 (fixtures alone took 41), so the
    # site stayed on v0.1.5-alpha until a rerun.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # 3.12 exactly: sum() over floats changed in 3.12 and the port follows it.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Export engine fixtures from Python
        run: python tests/fixtures/export_ts_fixtures.py

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      # The History replayer's double dummy solver: research/solver-rs/wasm,
      # built by `npm run wasm` before test and build. Rust is on the runner.
      - name: Rust for WebAssembly
        run: rustup target add wasm32-unknown-unknown
      - name: Type-check
        working-directory: frontend
        run: npm run check
      - name: Test (engine parity + table flow + saved games)
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  # The game on Cloudflare (server/cf, MULTIPLAYER_PLAN.md M7): the Worker,
  # its Durable Objects and the site, deployed with wrangler once everything
  # above passes on main. Served at
  # https://bridge.second-highest.workers.dev. The token is an environment
  # secret of `cloudflare`, which only main may use (Settings, Environments).
  cloudflare:
    needs: [build, python-tests, server]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare
      url: https://bridge.second-highest.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Rust for WebAssembly
        run: rustup target add wasm32-unknown-unknown
      - name: Install
        run: (cd frontend && npm ci) && (cd server/cf && npm ci)
      - name: Build the beta site (socket address and headers for Cloudflare)
        working-directory: server/cf
        env:
          VITE_BUILD: ${{ github.sha }}
        run: npm run site
      - name: Deploy
        working-directory: server/cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
