<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page run under the notch and the home bar;
         felt.css keeps content clear of them with the safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Added to an iPhone's home screen, it opens full screen like an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="2nd-Highest" />
    <meta name="theme-color" content="#0d1915" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <!-- GitHub Pages can't send headers, so the CSP rides in the page. Styles
         need 'unsafe-inline' for inline style attributes. frame-ancestors is
         ignored in a meta tag, so framing can't be blocked here. The two
         cloudflareinsights.com origins are Cloudflare Web Analytics (below):
         its script, and where it sends page views. Nothing else is allowed. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <title>Second-Highest Bridge</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22 fill=%22%23c9a961%22%3E%E2%99%A0%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- Cloudflare Web Analytics: cookieless page-view counts. The token is
         public by design; it only says which dashboard the counts go to. -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "edf7e4cfa48942bc83cf60b3dec3dbb7"}'></script>
  </body>
</html>
