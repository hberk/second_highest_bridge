[package]
name = "solver-wasm"
version = "0.1.0"
edition = "2024"

# The double dummy solver for the web app's History replayer, built for
# wasm32-unknown-unknown: no OS, so numbers in and out through exported
# memory. `npm run wasm` in frontend/ builds it and copies the .wasm there.

[lib]
crate-type = ["cdylib"]

[dependencies]
solver-rs = { path = ".." }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
